spring:
  application:
    name: settlement
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: 8082
  shutdown: graceful
management:
  server:
    port: 9466
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        live:
          include: livenessState
        ready:
          include: readinessState
