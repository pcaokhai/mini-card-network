openapi: 3.1.0
info:
  title: Mini Card Network API
  version: 1.0.0
  description: |
    REST contract between web-next (BFF) and gateway-go, issuer-jpos Admin API and settlement.
    Conventions: docs/04-api-contract.md. Money = integer minor units. No PAN/CVV/PIN/track data ever.
servers:
  - url: http://localhost:8080
    description: gateway-go
  - url: http://localhost:8081
    description: issuer-jpos Admin API
  - url: http://localhost:8082
    description: settlement
tags:
  - name: transactions
  - name: lab
  - name: network
  - name: chaos
  - name: metrics
  - name: cards
  - name: keys
  - name: settlement

paths:
  /v1/transactions/purchases:
    post:
      tags: [transactions]
      operationId: createPurchase
      summary: Purchase (0200). Waits for the issuer up to the ISO timeout.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseRequest' }
      responses:
        '201':
          description: Transaction created; status tells the outcome (declines are not HTTP errors)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        default: { $ref: '#/components/responses/Problem' }
  /v1/transactions/pre-authorizations:
    post:
      tags: [transactions]
      operationId: createPreAuthorization
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/transactions/{rrn}/completions:
    post:
      tags: [transactions]
      operationId: createCompletion
      parameters: [{ $ref: '#/components/parameters/Rrn' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties: { amount: { $ref: '#/components/schemas/Money' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/transactions/refunds:
    post:
      tags: [transactions]
      operationId: createRefund
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseRequest' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/transactions/balance-inquiries:
    post:
      tags: [transactions]
      operationId: createBalanceInquiry
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CardPresentData' }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/transactions/{rrn}/cancellations:
    post:
      tags: [transactions]
      operationId: cancelTransaction
      summary: POS cancellation, produces a 0420 with reason 17
      parameters: [{ $ref: '#/components/parameters/Rrn' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Reversal queued, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/transactions:
    get:
      tags: [transactions]
      operationId: listTransactions
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TransactionStatus' } }
        - { name: rc, in: query, schema: { type: string, pattern: '^[0-9A-Z]{2}$' } }
        - { name: last4, in: query, schema: { type: string, pattern: '^[0-9]{4}$' } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Page of transactions, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TransactionSummary' } }
                  nextCursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }
  /v1/transactions/{rrn}:
    get:
      tags: [transactions]
      operationId: getTransaction
      parameters: [{ $ref: '#/components/parameters/Rrn' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Transaction' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/transactions/{rrn}/journey:
    get:
      tags: [transactions]
      operationId: getTransactionJourney
      parameters: [{ $ref: '#/components/parameters/Rrn' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Journey' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/terminals:
    get:
      tags: [transactions]
      operationId: listTerminals
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Terminal' } }

  /v1/lab/messages/decode:
    post:
      tags: [lab]
      operationId: decodeMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw]
              properties:
                raw: { type: string, description: 'Packed message as ASCII (MCN-87A), without length header', maxLength: 8192 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DecodedMessage' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lab/messages/encode:
    post:
      tags: [lab]
      operationId: encodeMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mti, fields]
              properties:
                mti: { type: string, pattern: '^[0-9]{4}$' }
                fields: { type: object, additionalProperties: { type: string }, description: 'DE number → value' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/DecodedMessage' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/lab/messages/samples:
    get:
      tags: [lab]
      operationId: listSampleMessages
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [mti, label, raw]
                  properties: { mti: { type: string }, label: { type: string }, raw: { type: string } }

  /v1/network/links:
    get:
      tags: [network]
      operationId: listLinks
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Link' } } } } }
  /v1/network/links/{linkId}/echo:
    post:
      tags: [network]
      operationId: echoLink
      parameters: [{ $ref: '#/components/parameters/LinkId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Echo result, content: { application/json: { schema: { $ref: '#/components/schemas/EchoResult' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/network/links/{linkId}/sign-on:
    post:
      tags: [network]
      operationId: signOnLink
      parameters: [{ $ref: '#/components/parameters/LinkId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Link' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/network/links/{linkId}/sign-off:
    post:
      tags: [network]
      operationId: signOffLink
      parameters: [{ $ref: '#/components/parameters/LinkId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Link' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/network/saf:
    get:
      tags: [network]
      operationId: getSaf
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [depth, deadCount, items]
                properties:
                  depth: { type: integer, minimum: 0 }
                  deadCount: { type: integer, minimum: 0 }
                  items: { type: array, items: { $ref: '#/components/schemas/SafItem' } }
  /v1/network/events:
    get:
      tags: [network]
      operationId: listNetworkEvents
      parameters: [{ $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/NetworkEvent' } }
                  nextCursor: { type: [string, 'null'] }
  /v1/network/switch:
    get:
      tags: [network]
      operationId: getSwitchStatus
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SwitchStatus' } } } }

  /v1/chaos/scenarios:
    get:
      tags: [chaos]
      operationId: listChaosScenarios
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChaosScenario' } } } } }
  /v1/chaos/scenarios/{scenarioId}:
    put:
      tags: [chaos]
      operationId: setChaosScenario
      parameters:
        - { name: scenarioId, in: path, required: true, schema: { $ref: '#/components/schemas/ChaosScenarioId' } }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChaosScenario' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/chaos/runs:
    post:
      tags: [chaos]
      operationId: startChaosRun
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [transactions], properties: { transactions: { type: integer, minimum: 1, maximum: 10000 } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/ChaosRun' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/chaos/runs/{runId}:
    get:
      tags: [chaos]
      operationId: getChaosRun
      parameters: [{ name: runId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChaosRun' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/metrics/overview:
    get:
      tags: [metrics]
      operationId: getOverview
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Overview' } } } }

  /v1/cards:
    get:
      tags: [cards]
      operationId: listCards
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CardSummary' } } } } }
  /v1/cards/{cardRef}:
    get:
      tags: [cards]
      operationId: getCard
      parameters: [{ $ref: '#/components/parameters/CardRef' }]
      responses:
        '200':
          description: OK
          headers: { ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/CardDetail' } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/cards/{cardRef}/blocks:
    post:
      tags: [cards]
      operationId: blockCard
      parameters: [{ $ref: '#/components/parameters/CardRef' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, enum: [CUSTOMER_REQUEST, LOST, STOLEN, FRAUD_SUSPECTED] } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CardDetail' } } } }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [cards]
      operationId: unblockCard
      parameters: [{ $ref: '#/components/parameters/CardRef' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CardDetail' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/cards/{cardRef}/limits:
    put:
      tags: [cards]
      operationId: updateCardLimits
      parameters:
        - { $ref: '#/components/parameters/CardRef' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CardLimits' } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/CardDetail' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/cards/{cardRef}/ledger:
    get:
      tags: [cards]
      operationId: getCardLedger
      parameters: [{ $ref: '#/components/parameters/CardRef' }, { $ref: '#/components/parameters/Limit' }, { $ref: '#/components/parameters/Cursor' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/JournalEntry' } }
                  nextCursor: { type: [string, 'null'] }

  /v1/keys/issuer:
    get:
      tags: [keys]
      operationId: listIssuerKeys
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KeyInfo' } } } } }
  /v1/keys/acquirer:
    get:
      tags: [keys]
      operationId: listAcquirerKeys
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/KeyInfo' } } } } }
  /v1/keys/acquirer/rotations:
    post:
      tags: [keys]
      operationId: startKeyRotation
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [keyType], properties: { keyType: { type: string, enum: [ZPK, ZAK] } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/KeyRotation' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/keys/acquirer/rotations/{rotationId}:
    get:
      tags: [keys]
      operationId: getKeyRotation
      parameters: [{ name: rotationId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/KeyRotation' } } } }
        default: { $ref: '#/components/responses/Problem' }

  /v1/settlement/days/{businessDate}:
    get:
      tags: [settlement]
      operationId: getSettlementDay
      parameters: [{ $ref: '#/components/parameters/BusinessDate' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementDay' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/settlement/days/{businessDate}/cutover:
    post:
      tags: [settlement]
      operationId: triggerCutover
      parameters: [{ $ref: '#/components/parameters/BusinessDate' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementDay' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/settlement/days/{businessDate}/reconciliations:
    post:
      tags: [settlement]
      operationId: runReconciliation
      parameters: [{ $ref: '#/components/parameters/BusinessDate' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementDay' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/settlement/days/{businessDate}/breaks:
    get:
      tags: [settlement]
      operationId: listBreaks
      parameters: [{ $ref: '#/components/parameters/BusinessDate' }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReconBreak' } } } } }
  /v1/settlement/breaks/{breakId}/resolutions:
    post:
      tags: [settlement]
      operationId: resolveBreak
      parameters: [{ name: breakId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution: { type: string, enum: [AUTO_RESOLVED, MANUAL_ADJUSTED, WRITTEN_OFF] }
                note: { type: string, maxLength: 500 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ReconBreak' } } } }
        default: { $ref: '#/components/responses/Problem' }
  /v1/settlement/days/{businessDate}/clearing-files:
    post:
      tags: [settlement]
      operationId: generateClearingFile
      parameters: [{ $ref: '#/components/parameters/BusinessDate' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/ClearingFile' } } } }
        default: { $ref: '#/components/responses/Problem' }

components:
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
    Rrn: { name: rrn, in: path, required: true, schema: { type: string, pattern: '^[0-9A-Z]{12}$' } }
    CardRef: { name: cardRef, in: path, required: true, schema: { type: string, pattern: '^crd_[A-Za-z0-9]{10,32}$' } }
    LinkId: { name: linkId, in: path, required: true, schema: { type: string } }
    BusinessDate: { name: businessDate, in: path, required: true, schema: { type: string, format: date } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        errors:
          type: array
          items: { type: object, required: [field, message], properties: { field: { type: string }, message: { type: string } } }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, format: int64, minimum: 0, description: minor units }
        currency: { type: string, pattern: '^[0-9]{3}$', examples: ['704'] }
    EntryMode: { type: string, enum: [CHIP_PIN, CHIP_NO_PIN, MANUAL_PIN, MANUAL_NO_PIN] }
    CardPresentData:
      type: object
      required: [terminalId, cardToken, entryMode]
      properties:
        terminalId: { type: string, minLength: 8, maxLength: 8 }
        cardToken: { type: string, description: 'Simulator token for a test card from contracts/fixtures/cards.json; never a PAN' }
        entryMode: { $ref: '#/components/schemas/EntryMode' }
        encryptedPinBlock: { type: string, pattern: '^[0-9A-F]{16}$', description: 'PIN block under the terminal TPK' }
        emvData: { type: string, pattern: '^([0-9A-F]{2})*$', description: 'TLV hex, chip entry only' }
    PurchaseRequest:
      allOf:
        - { $ref: '#/components/schemas/CardPresentData' }
        - type: object
          required: [amount]
          properties: { amount: { $ref: '#/components/schemas/Money' } }
    TransactionType: { type: string, enum: [PURCHASE, PREAUTH, COMPLETION, REFUND, BALANCE, REVERSAL] }
    TransactionStatus:
      type: string
      enum: [CREATED, SENT, APPROVED, DECLINED, TIMED_OUT, REVERSAL_PENDING, REVERSED, FAILED]
    TransactionSummary:
      type: object
      required: [rrn, type, status, amount, maskedPan, terminalId, merchantName, createdAt]
      properties:
        rrn: { type: string }
        stan: { type: string }
        type: { $ref: '#/components/schemas/TransactionType' }
        status: { $ref: '#/components/schemas/TransactionStatus' }
        responseCode: { type: [string, 'null'] }
        responseLabel: { type: [string, 'null'], description: 'Plain-language label for Easy mode' }
        amount: { $ref: '#/components/schemas/Money' }
        maskedPan: { type: string, pattern: '^[0-9]{6}\*{2,9}[0-9]{4}$' }
        terminalId: { type: string }
        merchantName: { type: string }
        latencyMs: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
    Transaction:
      allOf:
        - { $ref: '#/components/schemas/TransactionSummary' }
        - type: object
          properties:
            authCode: { type: [string, 'null'] }
            approvedAmount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
            balance: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: balance inquiry only }
            businessDate: { type: string, format: date }
            originalRrn: { type: [string, 'null'] }
            traceId: { type: string }
    Actor: { type: string, enum: [POS, ACQUIRER, ISSUER, SAF, NETWORK, SWITCH] }
    StepKind: { type: string, enum: [OK, WARN, BAD, REVERSAL, INFO] }
    IsoField:
      type: object
      required: [de, easyName, technicalName, format, value]
      properties:
        de: { type: string, description: "'MTI' or data element number" }
        easyName: { type: string }
        technicalName: { type: string }
        format: { type: string }
        value: { type: string, description: masked where required }
        raw: { type: string }
    IsoMessage:
      type: object
      required: [mti, fields]
      properties:
        mti: { type: string }
        fields: { type: array, items: { $ref: '#/components/schemas/IsoField' } }
    JourneyStep:
      type: object
      required: [seq, actor, offsetMs, title, easyText, technicalText, kind]
      properties:
        seq: { type: integer }
        actor: { $ref: '#/components/schemas/Actor' }
        offsetMs: { type: integer, minimum: 0 }
        title: { type: string }
        easyText: { type: string }
        technicalText: { type: string }
        kind: { $ref: '#/components/schemas/StepKind' }
        message: { oneOf: [{ $ref: '#/components/schemas/IsoMessage' }, { type: 'null' }] }
    Journey:
      type: object
      required: [transaction, steps, money]
      properties:
        transaction: { $ref: '#/components/schemas/Transaction' }
        steps: { type: array, items: { $ref: '#/components/schemas/JourneyStep' } }
        money:
          type: array
          items:
            type: object
            required: [label, delta, atStep]
            properties:
              label: { type: string }
              delta: { type: integer, format: int64, description: 'signed minor units, 0 for balance rows' }
              balanceAfter: { type: [integer, 'null'], format: int64 }
              atStep: { type: integer }
    DecodedMessage:
      type: object
      required: [mti, primaryBitmap, segments, fields]
      properties:
        mti: { type: string }
        primaryBitmap: { type: string, pattern: '^[0-9A-F]{16}$' }
        secondaryBitmap: { type: [string, 'null'], pattern: '^[0-9A-F]{16}$' }
        segments:
          type: array
          description: Ordered raw segments for highlighting
          items:
            type: object
            required: [key, text]
            properties: { key: { type: string }, text: { type: string } }
        fields: { type: array, items: { $ref: '#/components/schemas/IsoField' } }
    Terminal:
      type: object
      required: [terminalId, merchantId, merchantName, mcc]
      properties:
        terminalId: { type: string }
        merchantId: { type: string }
        merchantName: { type: string }
        mcc: { type: string }
    LinkStatus: { type: string, enum: [DISCONNECTED, CONNECTED, SIGNED_ON, DOWN] }
    Link:
      type: object
      required: [linkId, from, to, status, inFlight]
      properties:
        linkId: { type: string }
        from: { type: string }
        to: { type: string }
        status: { $ref: '#/components/schemas/LinkStatus' }
        lastEchoAt: { type: [string, 'null'], format: date-time }
        lastEchoOk: { type: [boolean, 'null'] }
        p99LatencyMs: { type: [integer, 'null'] }
        inFlight: { type: integer }
    EchoResult:
      type: object
      required: [ok]
      properties: { ok: { type: boolean }, latencyMs: { type: [integer, 'null'] }, responseCode: { type: [string, 'null'] } }
    SafItem:
      type: object
      required: [id, mti, rrn, attempts, status, nextRetryAt]
      properties:
        id: { type: string }
        mti: { type: string, enum: ['0120', '0220', '0420'] }
        rrn: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        attempts: { type: integer }
        status: { type: string, enum: [PENDING, IN_FLIGHT, ACKED, DEAD] }
        nextRetryAt: { type: string, format: date-time }
        lastError: { type: [string, 'null'] }
    NetworkEvent:
      type: object
      required: [id, occurredAt, severity, easyText, technicalText]
      properties:
        id: { type: string }
        occurredAt: { type: string, format: date-time }
        severity: { type: string, enum: [INFO, OK, WARN, ERROR] }
        easyText: { type: string }
        technicalText: { type: string }
    SwitchStatus:
      type: object
      required: [circuit, stipActive, stipLimit, stipApprovedCount]
      properties:
        circuit: { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
        stipActive: { type: boolean }
        stipLimit: { $ref: '#/components/schemas/Money' }
        stipApprovedCount: { type: integer }
    ChaosScenarioId: { type: string, enum: [SLOW_NETWORK, CONNECTION_CUT, DROP_RESPONSE, DUPLICATE_REQUEST, ISSUER_DOWN, LATE_RESPONSE] }
    ChaosScenario:
      type: object
      required: [id, enabled, easyText, technicalText]
      properties:
        id: { $ref: '#/components/schemas/ChaosScenarioId' }
        enabled: { type: boolean }
        easyText: { type: string }
        technicalText: { type: string }
    ChaosRun:
      type: object
      required: [runId, status, requested, completed]
      properties:
        runId: { type: string }
        status: { type: string, enum: [RUNNING, VERIFYING, PASSED, FAILED] }
        requested: { type: integer }
        completed: { type: integer }
        approved: { type: integer }
        declined: { type: integer }
        reversed: { type: integer }
        openingBalanceTotal: { type: integer, format: int64 }
        closingBalanceTotal: { type: integer, format: int64 }
        ledgerDiscrepancy: { type: integer, format: int64, description: must be 0 }
    Overview:
      type: object
      required: [transactionsToday, approvalRate, p99LatencyMs, ledgerMatches, throughput, declineReasons]
      properties:
        transactionsToday: { type: integer }
        transactionsDeltaPct: { type: number }
        approvalRate: { type: number, minimum: 0, maximum: 1 }
        p99LatencyMs: { type: integer }
        ledgerMatches: { type: boolean }
        throughput:
          type: array
          items: { type: object, required: [at, tps], properties: { at: { type: string, format: date-time }, tps: { type: number } } }
        declineReasons:
          type: array
          items: { type: object, required: [responseCode, label, share], properties: { responseCode: { type: string }, label: { type: string }, share: { type: number } } }
    CardStatus: { type: string, enum: [ACTIVE, BLOCKED, LOST, STOLEN, EXPIRED, PIN_BLOCKED] }
    CardSummary:
      type: object
      required: [cardRef, maskedPan, holderName, status, expiry]
      properties:
        cardRef: { type: string }
        maskedPan: { type: string }
        holderName: { type: string }
        status: { $ref: '#/components/schemas/CardStatus' }
        expiry: { type: string, pattern: '^[0-9]{2}/[0-9]{2}$' }
    CardLimits:
      type: object
      required: [dailyAmount, perTransactionAmount]
      properties:
        dailyAmount: { $ref: '#/components/schemas/Money' }
        perTransactionAmount: { $ref: '#/components/schemas/Money' }
        dailyCount: { type: [integer, 'null'] }
    CardDetail:
      allOf:
        - { $ref: '#/components/schemas/CardSummary' }
        - type: object
          required: [ledgerBalance, availableBalance, holds, limits, usedToday]
          properties:
            ledgerBalance: { $ref: '#/components/schemas/Money' }
            availableBalance: { $ref: '#/components/schemas/Money' }
            holds:
              type: array
              items:
                type: object
                required: [holdId, merchantName, amount, expiresAt, status]
                properties:
                  holdId: { type: string }
                  merchantName: { type: string }
                  amount: { $ref: '#/components/schemas/Money' }
                  expiresAt: { type: string, format: date-time }
                  status: { type: string, enum: [ACTIVE, COMPLETED, RELEASED, EXPIRED] }
            limits: { $ref: '#/components/schemas/CardLimits' }
            usedToday: { $ref: '#/components/schemas/Money' }
    JournalEntry:
      type: object
      required: [journalId, occurredAt, description, entryType, postings]
      properties:
        journalId: { type: string }
        occurredAt: { type: string, format: date-time }
        description: { type: string }
        entryType: { type: string, enum: [PURCHASE, CASH, REFUND, REVERSAL, COMPLETION, FEE, ADJUSTMENT] }
        rrn: { type: [string, 'null'] }
        postings:
          type: array
          items:
            type: object
            required: [account, direction, amount]
            properties:
              account: { type: string, description: 'customer account number (masked) or GL code' }
              direction: { type: string, enum: [DEBIT, CREDIT] }
              amount: { $ref: '#/components/schemas/Money' }
    KeyInfo:
      type: object
      required: [keyType, kcv, status, daysRemaining, lifetimeDays]
      properties:
        keyType: { type: string, enum: [ZMK, ZPK, ZAK, TPK, TAK, CVK, PVK] }
        counterparty: { type: [string, 'null'] }
        kcv: { type: string, pattern: '^[0-9A-F]{6}$' }
        status: { type: string, enum: [PENDING, ACTIVE, RETIRED] }
        activatedAt: { type: [string, 'null'], format: date-time }
        daysRemaining: { type: integer }
        lifetimeDays: { type: integer }
    KeyRotation:
      type: object
      required: [rotationId, keyType, status, steps]
      properties:
        rotationId: { type: string }
        keyType: { type: string }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        newKcv: { type: [string, 'null'] }
        steps:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string, enum: [GENERATE, SEND_0800_161, PARTNER_CONFIRM, ACTIVATE] }
              status: { type: string, enum: [PENDING, DONE, FAILED] }
              completedAt: { type: [string, 'null'], format: date-time }
    SettlementStage: { type: string, enum: [OPEN, CUTOVER_DONE, TOTALS_EXCHANGED, RECONCILED, FILE_GENERATED] }
    TotalsRow:
      type: object
      required: [metric, isoField, acquirer, issuer, matches]
      properties:
        metric: { type: string, enum: [DEBITS_COUNT, DEBITS_AMOUNT, DEBIT_REVERSALS_COUNT, DEBIT_REVERSALS_AMOUNT, NET_AMOUNT] }
        isoField: { type: string }
        acquirer: { type: integer, format: int64 }
        issuer: { type: integer, format: int64 }
        matches: { type: boolean }
    SettlementDay:
      type: object
      required: [businessDate, stage, totals, openBreaks]
      properties:
        businessDate: { type: string, format: date }
        stage: { $ref: '#/components/schemas/SettlementStage' }
        totals: { type: array, items: { $ref: '#/components/schemas/TotalsRow' } }
        matchedCount: { type: [integer, 'null'] }
        totalCount: { type: [integer, 'null'] }
        openBreaks: { type: integer }
        netPosition: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        clearingFile: { oneOf: [{ $ref: '#/components/schemas/ClearingFile' }, { type: 'null' }] }
    ReconBreak:
      type: object
      required: [breakId, breakType, rrn, amountDiff, resolution]
      properties:
        breakId: { type: string }
        breakType: { type: string, enum: [MISSING_AT_ISSUER, MISSING_AT_ACQUIRER, AMOUNT_MISMATCH, STATUS_MISMATCH, DUPLICATE] }
        rrn: { type: string }
        amountDiff: { $ref: '#/components/schemas/Money' }
        easyText: { type: string }
        technicalText: { type: string }
        resolution: { type: string, enum: [OPEN, AUTO_RESOLVED, MANUAL_ADJUSTED, WRITTEN_OFF] }
        resolvedBy: { type: [string, 'null'] }
    ClearingFile:
      type: object
      required: [fileName, recordCount, total, sha256, status]
      properties:
        fileName: { type: string }
        recordCount: { type: integer }
        total: { $ref: '#/components/schemas/Money' }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        status: { type: string, enum: [GENERATED, SENT, ACKNOWLEDGED, REJECTED] }
