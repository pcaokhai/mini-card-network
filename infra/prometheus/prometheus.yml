global:
  scrape_interval: 5s
scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ['gateway:9464'] }]
  - job_name: issuer
    static_configs: [{ targets: ['issuer:9465'] }]
  - job_name: settlement
    metrics_path: /prometheus
    static_configs: [{ targets: ['settlement:9466'] }]
  - job_name: otel-collector
    static_configs: [{ targets: ['otel-collector:8888'] }]
