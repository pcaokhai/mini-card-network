services:
  issuer:
    # context is the repo root: `make up` combines this file with others via
    # --project-directory ., and docker compose resolves a relative build.context against
    # that project directory (not this file's own directory) once multiple -f files are
    # merged - confirmed with `docker compose ... config`. `.` here IS the repo root, not
    # ./issuer-jpos: the Gradle build reads ../contracts/iso8583/packager-spec.yaml, which
    # must be visible inside the build.
    build: { context: ., dockerfile: issuer-jpos/Dockerfile }
    environment:
      OTEL_SERVICE_NAME: issuer
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports: ["8081:8081", "9465:9465"]
    stop_grace_period: 35s
    depends_on: [otel-collector, postgres]
