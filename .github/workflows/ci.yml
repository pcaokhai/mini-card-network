name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # nightly chaos suite at 02:00 UTC (MCN-407)

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      iss: ${{ steps.filter.outputs.iss }}
      gw: ${{ steps.filter.outputs.gw }}
      web: ${{ steps.filter.outputs.web }}
      set: ${{ steps.filter.outputs.set }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            iss:
              - 'issuer-jpos/**'
            gw:
              - 'gateway-go/**'
            web:
              - 'web-next/**'
            set:
              - 'settlement/**'

  lint-test-iss:
    needs: changes
    if: needs.changes.outputs.iss == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('issuer-jpos/build.gradle.kts', 'issuer-jpos/build.gradle') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Lint + test issuer-jpos
        run: |
          if [ -f issuer-jpos/build.gradle.kts ] || [ -f issuer-jpos/build.gradle ]; then
            cd issuer-jpos && ./gradlew --no-daemon spotlessCheck test
          else
            echo "skip: issuer-jpos not scaffolded yet"
          fi

  lint-test-gw:
    needs: changes
    if: needs.changes.outputs.gw == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('gateway-go/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: gateway-go/go.mod
      - if: hashFiles('gateway-go/go.mod') != ''
        uses: golangci/golangci-lint-action@v7
        with:
          # v6 of this action only supports golangci-lint v1; our .golangci.yml is v2 format
          # (per the plan) and needs v7 of the action to install a v2.x binary at all.
          version: v2.6.1
          working-directory: gateway-go
          args: --timeout=5m
      - name: Lint + test gateway-go
        run: |
          if [ -f gateway-go/go.mod ]; then
            cd gateway-go && go test -race -count=1 ./...
          else
            echo "skip: gateway-go not scaffolded yet"
          fi
      - if: hashFiles('gateway-go/go.mod') != ''
        name: Fuzz ISO 8583 unpack (short)
        run: cd gateway-go && go test ./internal/iso8583 -run FuzzUnpack -fuzz FuzzUnpack -fuzztime 60s

  lint-test-web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('web-next/package.json') != ''
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web-next/package.json
      - if: hashFiles('web-next/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version-file: web-next/.nvmrc
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml
      - name: Lint + test web-next
        run: |
          if [ -f web-next/package.json ]; then
            make -C web-next lint test
          else
            echo "skip: web-next not scaffolded yet"
          fi

  lint-test-set:
    needs: changes
    if: needs.changes.outputs.set == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: hashFiles('settlement/build.gradle.kts', 'settlement/build.gradle') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Lint + test settlement
        run: |
          if [ -f settlement/build.gradle.kts ] || [ -f settlement/build.gradle ]; then
            cd settlement && ./gradlew --no-daemon spotlessCheck test
          else
            echo "skip: settlement not scaffolded yet"
          fi

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r contracts/requirements.txt
      - run: make contracts
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
          API_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking') }}

  pci-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks-action diffs base^..head; a shallow clone can't resolve that range
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway-go/go.mod
      - name: PCI scan (PAN / PIN block / track data)
        run: make pci-scan
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  chaos:
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'chaos')
    runs-on: ubuntu-latest
    env:
      CHAOS_TX_PER_SCENARIO: ${{ github.event_name == 'schedule' && '10000' || '500' }}
      CHAOS_FAKE_ISSUER_ADDR: "gateway:19999"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway-go/go.mod
      - run: make up
      - name: Run chaos suite
        run: make chaos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-report
          path: chaos-report.md

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            perf
            ci
